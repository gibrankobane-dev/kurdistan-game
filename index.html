<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Massey Ferguson 168 - المحاكي الزراعي الواقعي</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px 25px;
            border-radius: 12px;
            border: 2px solid #cc0000;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: right;
        }
        #ui-overlay h1 {
            margin: 0 0 5px 0;
            font-size: 20px;
            color: #ff5252;
        }
        #ui-overlay p {
            margin: 0;
            font-size: 16px;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            border: 1px solid #555;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
    </style>
    <!-- مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <h1>Massey Ferguson 168 🚜</h1>
        <p id="speed-display">السرعة: 0 كم/س</p>
    </div>

    <div id="controls-hint">
        استخدم أزرار W A SD أو الأسهم للقيادة والانعطاف
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // سماء صافية

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(100, 150, 100);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // الأرضية الزراعية (تربة حمراء)
        const groundGeo = new THREE.PlaneGeometry(800, 800);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x7a3828, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // إضافة أشجار زيتون متفرقة في البيئة المحيطة
        function createOliveTree(x, z) {
            const treeGroup = new THREE.Group();
            // الجذع
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 3, 8);
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1.5;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            // الأوراق (أخضر زيتي)
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x4a5d4e });
            const leavesGeo = new THREE.DodecahedronGeometry(2.2);
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 4;
            leaves.castShadow = true;
            treeGroup.add(leaves);

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
        }

        // توزيع بعض الأشجار حول المزرعة
        for (let i = -300; i <= 300; i += 40) {
            if (Math.abs(i) > 20) {
                createOliveTree(i, -50);
                createOliveTree(i, 50);
                createOliveTree(-50, i);
                createOliveTree(50, i);
            }
        }

        // بناء تفصيلي للجرار Massey Ferguson 168
        const tractorGroup = new THREE.Group();

        const mfRed = new THREE.MeshStandardMaterial({ color: 0xd40000, roughness: 0.3 }); // أحمر مميز
        const mfDark = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 }); // أسود للمحرك والعجلات
        const mfGlass = new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.6 }); // زجاج الكابينة

        // الشاسيه الرئيسي
        const bodyGeo = new THREE.BoxGeometry(1.6, 0.8, 2.8);
        const body = new THREE.Mesh(bodyGeo, mfRed);
        body.position.y = 1.1;
        body.castShadow = true;
        tractorGroup.add(body);

        // غطاء المحرك الأمامي
        const hoodGeo = new THREE.BoxGeometry(1.3, 0.9, 1.8);
        const hood = new THREE.Mesh(hoodGeo, mfRed);
        hood.position.set(0, 1.2, 1.7);
        hood.castShadow = true;
        tractorGroup.add(hood);

        // شبكة المحرك الأمامية
        const grillGeo = new THREE.BoxGeometry(1.2, 0.7, 0.1);
        const grillMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
        const grill = new THREE.Mesh(grillGeo, grillMat);
        grill.position.set(0, 1.1, 2.61);
        tractorGroup.add(grill);

        // كابينة السائق
        const cabGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const cab = new THREE.Mesh(cabGeo, mfGlass);
        cab.position.set(0, 2.15, -0.2);
        cab.castShadow = true;
        tractorGroup.add(cab);

        // سقف الكابينة
        const roofGeo = new THREE.BoxGeometry(1.6, 0.15, 1.6);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.set(0, 2.95, -0.2);
        roof.castShadow = true;
        tractorGroup.add(roof);

        // مدخنة العادم (المحرك)
        const exhaustGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.2, 12);
        const exhaust = new THREE.Mesh(exhaustGeo, mfDark);
        exhaust.position.set(0.5, 2.3, 2.2);
        exhaust.castShadow = true;
        tractorGroup.add(exhaust);

        // العجلات الأمامية (صغيرة)
        const frontWheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.35, 16);
        frontWheelGeo.rotateZ(Math.PI / 2);

        const wheelFL = new THREE.Mesh(frontWheelGeo, mfDark);
        wheelFL.position.set(0.95, 0.45, 1.8);
        tractorGroup.add(wheelFL);

        const wheelFR = new THREE.Mesh(frontWheelGeo, mfDark);
        wheelFR.position.set(-0.95, 0.45, 1.8);
        tractorGroup.add(wheelFR);

        // العجلات الخلفية (كبيرة - مميزة للجرارات الزراعية)
        const rearWheelGeo = new THREE.CylinderGeometry(0.85, 0.85, 0.55, 20);
        rearWheelGeo.rotateZ(Math.PI / 2);

        const wheelRL = new THREE.Mesh(rearWheelGeo, mfDark);
        wheelRL.position.set(1.05, 0.85, -0.9);
        tractorGroup.add(wheelRL);

        const wheelRR = new THREE.Mesh(rearWheelGeo, mfDark);
        wheelRR.position.set(-1.05, 0.85, -0.9);
        tractorGroup.add(wheelRR);

        scene.add(tractorGroup);
        tractorGroup.position.set(0, 0, 0);

        // متغيرات الحركة والتحكم
        const keys = { w: false, s: false, a: false, d: false };
        let speed = 0;
        let maxSpeed = 0.35;
        let acceleration = 0.006;
        let deceleration = 0.008;
        let steerAngle = 0;

        window.addEventListener('keydown', (e) => {
            if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.w = true;
            if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.s = true;
            if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.a = true;
            if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.w = false;
            if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.s = false;
            if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.a = false;
            if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.d = false;
        });

        // حلقة التحديث والرسومات
        function animate() {
            requestAnimationFrame(animate);

            if (keys.w) {
                speed = Math.min(speed + acceleration, maxSpeed);
            } else if (keys.s) {
                speed = Math.max(speed - acceleration, -maxSpeed / 2);
            } else {
                if (speed > 0) speed = Math.max(speed - deceleration, 0);
                if (speed < 0) speed = Math.min(speed + deceleration, 0);
            }

            if (keys.a) steerAngle += 0.035;
            if (keys.d) steerAngle -= 0.035;
            steerAngle *= 0.92;

            if (speed !== 0) {
                tractorGroup.rotation.y += steerAngle * (speed * 2.2);
                tractorGroup.translateZ(speed);
            }

            // دوران العجلات أثناء الحركة
            wheelFL.rotation.x += speed * 2;
            wheelFR.rotation.x += speed * 2;
            wheelRL.rotation.x += speed * 2;
            wheelRR.rotation.x += speed * 2;

            document.getElementById('speed-display').innerText = `السرعة: ${Math.round(Math.abs(speed) * 120)} كم/س`;

            // الكاميرا المتابعة
            const cameraOffset = new THREE.Vector3(0, 4.5, -9);
            cameraOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), tractorGroup.rotation.y);
            camera.position.copy(tractorGroup.position).add(cameraOffset);
            camera.lookAt(tractorGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0)));

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
